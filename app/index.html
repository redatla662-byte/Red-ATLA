<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de falla</title>
    <style>
        body{font-family: Arial, Helvetica, sans-serif; max-width: 450px; margin: 30px auto; padding: 20px; line-height: 1.5;}
        .nota{background-color: #f5f5f5; padding: 15px; border-left: 5px solid #673ab7; margin-bottom: 20px; font-size: 14px; border-radius: 4px;}
        .campo{margin-bottom: 15px;}
        label{display: block;margin-bottom: 5px; font-weight: bold;}
        input[type="text"], textarea, select{width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;}
        button{ background-color: #673ab7; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px;}
        button:hover{ background-color:#512da8;}
        .asterisco { color: red; }
    </style>
</head>
<body>
    <h2>REPORTE DE FALLAS</h2>
    
    <div class="nota">
        En este formulario podrás realizar tu reporte para que un alumno de servicio social pueda realizar la reparación correspondiente. <br><br>
        <strong>Nota:</strong> Este reporte nos permite agilizar la reparación pertinente al problema; el hacer una declaración falsa te puede hacer acreedor a una sanción.
    </div>

    <form action="/enviar" method="POST">
        <div class="campo">
            <label for="tipo_usuario">¿Qué tipo de usuario eres? <span class="asterisco">*</span></label>
            <!-- El evento oninput y onchange aseguran que Windows detecte el clic de inmediato -->
            <select id="tipo_usuario" name="tipo_usuario" required onchange="cambiarIdentificacion()" oninput="cambiarIdentificacion()">
                <option value="Alumno" selected>Alumno</option>
                <option value="Profesor">Profesor</option>
            </select>
        </div>

        <div class="campo">
            <label for="nombre">Nombre Completo <span class="asterisco">*</span></label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej. Flor Azucena Zamora Trujillo" required>
        </div>

        <div class="campo">
            <label id="label_identificacion" for="identificacion">Número de boleta <span class="asterisco">*</span></label>
            <input type="text" id="identificacion" name="identificacion" required>
        </div>

        <div class="campo">
            <label for="ubicacion">Ubicación (Aulas, Laboratorios, Talleres, Salón) <span class="asterisco">*</span></label>
            <input type="text" id="ubicacion" name="ubicacion" required>
        </div>
 
        <div class="campo">
            <label for="urgencia">Nivel de urgencia <span class="asterisco">*</span></label>
            <select id="urgencia" name="urgencia" required>
                <option value="" disabled selected>Selecciona una opción</option>
                <option value="Verde">Verde (no tan necesario)</option>
                <option value="Amarillo">Amarillo (necesario)</option>
                <option value="Rojo">Rojo (urgente)</option>
            </select>
        </div>

        <div class="campo">
             <label for="falla">¿Cuál es la falla? <span class="asterisco">*</span></label>
             <textarea id="falla" name="falla" rows="4" required></textarea>
        </div>

        <button type="submit">Enviar al servidor</button>
    </form>

    <script>
        function cambiarIdentificacion() {
            var tipoUsuario = document.getElementById('tipo_usuario').value;
            var label = document.getElementById('label_identificacion');
            
            if (tipoUsuario === 'Profesor') {
                label.innerHTML = 'Número de empleado <span class="asterisco">*</span>';
            } else {
                label.innerHTML = 'Número de boleta <span class="asterisco">*</span>';
            }
        }
        // Ejecutar al cargar la página por si se quedó seleccionada otra opción
        window.onload = cambiarIdentificacion;
    </script>
</body>
</html>
